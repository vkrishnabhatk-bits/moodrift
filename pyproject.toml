[project]
name = "moodrift"
version = "0.1.0"
description = "End-to-end MLOps pipeline for review-rating classification with drift-triggered retraining"
requires-python = ">=3.11,<3.12"

# Direct dependencies carry lower bounds only; the exact resolved versions are frozen into
# requirements.lock.txt (`make freeze`). Pinning in one place avoids the two files drifting
# apart. Nothing else installs from the lock yet - CI and container builds arrive in a
# later week, and this comment previously claimed they already did.
#
# Only packages this project actually imports are listed. Transitive dependencies belong in
# the lock, not here.
dependencies = [
    # data
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pandera>=0.22,<0.24",
    "numpy>=1.26",
    # versioning + tracking. dvc is invoked as a CLI (`python -m dvc repro`), never imported.
    "dvc>=3.59",
    "mlflow>=2.19",
    # config
    "pyyaml>=6.0",
    # modelling
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    # language identification (tier 0)
    "py3langid>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
