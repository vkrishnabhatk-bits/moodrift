# Tier 3 - fine-tuned DistilRoBERTa. The only tier that needs a GPU.
#
# Measured: 52 minutes on an Apple M1 Pro (14-core GPU) via PyTorch's MPS backend, at
# these settings on the full 42k training split. A free Colab/Kaggle T4 is roughly 2x
# faster. The script auto-selects CUDA, then MPS, then CPU - CPU is impractically slow.

name: tier3_distilroberta
seed: 42

base_model: distilroberta-base
num_labels: 5

# 256 tokens covers the large majority of reviews in this corpus; 512 roughly doubles
# training time for the tail. Revisit if the truncation rate looks high.
max_length: 256

epochs: 2
batch_size: 32
learning_rate: 2.0e-5
warmup_ratio: 0.1

# Optional cap on training rows, to fit inside a free-tier session. Leave null to use
# the full 42k training split.
subsample: null
