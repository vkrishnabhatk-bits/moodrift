# Monitoring and retraining-trigger configuration.
#
# Drafted in Week 2, implemented in Week 3. Every threshold here is an argument, and the
# argument is written down in docs/drift_design.md rather than left as a number someone
# once typed. Two rules held throughout:
#
#   1. A detector that fires on normal variation is worse than no detector - people learn
#      to ignore it. Thresholds are set to be quiet on the reference window itself, then
#      tuned against the simulated scenarios, not against intuition.
#   2. Nothing here trains anything. The trigger emits a decision; the retraining job acts
#      on it. Keeping the two separate is what makes the decision auditable.

reference:
  # Frozen in Week 1 from the test split, before any model existed - so model behaviour
  # cannot have contaminated the baseline it is measured against.
  path: data/reference/reference.parquet
  rows: 5000

windows:
  # One monitoring window = this many predictions. 500 is a compromise: large enough for
  # a KS test to have power and for a macro-F1 estimate on a 5-class problem to mean
  # something, small enough that a demo can fill three windows in a couple of minutes.
  size: 500
  # A window with fewer than this many predictions is not evaluated at all, rather than
  # evaluated badly.
  min_size: 200

input_drift:
  # Scalar features PSI and KS run on. Deliberately cheap and interpretable: if the
  # detector fires, you can look at a histogram and see why.
  features:
    - char_count
    - token_count
    - oov_rate          # share of tokens absent from the tier-1 training vocabulary
    - mean_word_length
  psi:
    bins: 10            # quantile bins from the reference window
    warn: 0.10          # the conventional "slight shift" line
    alert: 0.20         # the conventional "significant shift" line; drives WATCH
  ks:
    alpha: 0.05
    # With n=500 per window a KS test finds tiny, meaningless differences significant, so
    # significance alone never triggers anything: it must be accompanied by a PSI breach.
    require_psi_agreement: true

concept_drift:
  # A deliberately WEAK classifier separating reference from current embeddings. If even
  # this can tell the two windows apart, the distributions genuinely moved. A strong model
  # would "succeed" on noise and cry wolf every window.
  domain_classifier:
    features: feature_store      # the same MiniLM vectors training used - no second pipeline
    model: logistic_regression
    C: 0.1                       # heavy regularisation: the weakness is the point
    max_iter: 200
    cv_folds: 3
    seed: 42
  auc_warn: 0.60
  auc_alert: 0.65                # drives WATCH

performance_drift:
  # Ground truth lags by design - a star rating arrives when a labelled slice is reviewed,
  # not at prediction time. These thresholds are therefore evaluated on whatever labelled
  # slice exists, and never block the statistical detectors above.
  metrics: [macro_f1, macro_mae]
  # CORRECTED in Week 3, by measurement (src/monitor/simulate.py, ADR-0006). The 0.6001
  # figure this used to say is real, but it is the *training-time* number: tier3's own
  # evaluation scores `model_input` (Summary + ". " + Text, src/features/clean.py). The
  # live `/predict` endpoint has no Summary field at all - `PredictRequest` is a single
  # `text` string (docs/api_contract.md) - and `src/serve/app.py` feeds that string
  # straight to the model with no Summary prepended. Scored the same way `/predict`
  # actually scores (Text only, no Summary) on 4,000 real held-out rows: macro-F1 0.569,
  # macro-MAE 0.474 - roughly 4.8 macro-F1 points below the training-time number, and a
  # rolling-window baseline pinned against the wrong distribution would either miss real
  # degradation or (worse) flag every window as already-degraded from window one. This
  # is a real train/serve skew in the shipped API, not a monitoring-config problem -
  # flagged for the serving-plane owner in ADR-0006; monitoring's job here is to measure
  # against what is actually served, not what training scored.
  baseline_macro_f1: 0.569
  baseline_macro_mae: 0.474
  min_labelled_samples: 500
  # Kept as an absolute floor, not a fixed "5 points": PROJECT_PLAN.md §2 sets 0.55
  # macro-F1 as the project's own minimum acceptable score, independent of whichever
  # baseline this config pins. macro_f1_drop is baseline - 0.55 so "the trigger fires
  # exactly when the model stops meeting the bar it shipped at" stays true after the
  # baseline correction above, rather than silently drifting to a different number.
  # Same logic for macro_mae_rise against §2's 0.55-star MAE ceiling.
  macro_f1_drop: 0.019
  macro_mae_rise: 0.076

trigger:
  # Four tiers, because "retrain" is not one decision. Statistical drift is a reason to
  # look; degraded quality is a reason to queue; a cooldown and a data check are what stop
  # a flapping detector from retraining nightly.
  watch:
    sustained_windows: 3         # PSI/AUC breach must hold this long - one window is noise
    action: log_and_alert
  candidate:
    requires: performance_drift
    action: queue_and_open_issue
  fire:
    requires: candidate
    cooldown_days: 7             # no second retrain inside a week, whatever the detectors say
    require_data_validation: true  # the new window must pass the Pandera schema first
    action: trigger_training
  promote:
    min_macro_f1_gain: 0.01      # challenger must beat champion by >= 1 point
    allow_slice_regression: false  # and must not regress on any per-class slice
    action: move_production_alias
    # A failed promotion is recorded, not discarded: "we retrained and it was worse" is
    # information, and losing it means retraining again for the same reason next month.
    record_failed_attempts: true

simulation:
  # Ramped, not step functions: a step change is trivially detectable and proves nothing
  # about whether these thresholds work on a realistic drift.
  windows: 8
  scenarios:
    - name: vocabulary_shift
      inject: modern_slang_and_emoji
      ramp: [0.0, 0.4]           # share of injected rows, linear across windows
      expect: [psi, ks, domain_classifier]
    - name: topic_shift
      inject: other_product_category
      ramp: [0.0, 0.5]
      expect: [domain_classifier]
    - name: length_shift
      inject: long_reviews_only
      ramp: [0.0, 0.6]
      expect: [psi, ks, latency]
    - name: label_noise_sarcasm
      inject: contradictory_sentiment
      ramp: [0.0, 0.3]
      # The interesting one: the statistical detectors are expected to stay QUIET here,
      # and only rolling macro-F1/MAE catches it. A monitoring stack that cannot show this
      # gap does not understand its own detectors.
      expect: [performance_drift]

report:
  evidently_html: docs/drift_report.html
  markdown: docs/drift_report.md
  predictions: data/predictions/predictions.jsonl
