# The data plane as a reproducible DAG. `dvc repro` rebuilds only what changed.
#
# Embedding and writing to the feature store are one stage, not two: they are a single
# operation, and splitting them would mean serialising every vector twice for no benefit.
#
# The tier-1 TF-IDF vectoriser is intentionally NOT a stage here. It is fit inside the
# tier-1 training pipeline on the training split only, which is what keeps test vocabulary
# out of it.
#
# Every stage lists the shared modules it imports (src/config.py for path and config
# resolution, src/provenance.py for hashing and seeding). Omitting them is a silent
# correctness hole: text_key() in provenance.py determines every feature-store key, so a
# change there must invalidate the sampling and feature stages rather than leaving stale
# outputs that no longer match the code that produced them.

stages:
  download:
    # Fetching the raw corpus is its own stage so that a fresh clone can bootstrap with
    # no DVC remote and no credentials: the archive is this stage's *output*, so
    # `dvc repro` produces it rather than demanding it already exist. Tracking it with
    # `dvc add` instead would make it a required input and break `make data` on a clean
    # checkout - which is exactly the path an evaluator takes.
    cmd: python -m src.ingest.download
    deps:
      - src/ingest/download.py
      - src/ingest/loader.py
      - src/config.py
    params:
      - conf/data.yaml:
          - source
    outs:
      - data/raw/finefoods.txt.gz

  ingest:
    cmd: python -m src.ingest.loader
    deps:
      # The raw archive is a first-class, hashed dependency, not just something the
      # loader happens to download. Without it, a change to the upstream file would
      # silently produce a different dataset: DVC would consider the stage fresh,
      # because it only knew about the code and the config. Now any change to the raw
      # bytes invalidates ingest and everything downstream of it.
      - data/raw/finefoods.txt.gz
      - src/ingest/loader.py
      - src/config.py
    params:
      - conf/data.yaml:
          - source
          - paths
    outs:
      - data/interim/reviews.parquet

  validate:
    cmd: python -m src.ingest.schema
    deps:
      - src/ingest/schema.py
      - src/config.py
      - data/interim/reviews.parquet
    params:
      - conf/data.yaml:
          - validation
    outs:
      - data/interim/validated.parquet
      - data/interim/rejected/rejected.parquet
      - docs/data_quality_report.md:
          cache: false

  sample:
    cmd: python -m src.features.sample
    deps:
      - src/features/sample.py
      - src/features/clean.py
      - src/ingest/language_filter.py
      - src/config.py
      - src/provenance.py
      - data/interim/validated.parquet
    params:
      - conf/data.yaml:
          - sample
          - language_filter
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/reference/reference.parquet

  features:
    cmd: python -m src.features.embed
    deps:
      - src/features/embed.py
      - src/features/store.py
      - src/config.py
      - src/provenance.py
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/reference/reference.parquet
    params:
      - conf/model_tier2.yaml:
          - embedding
    outs:
      - data/feature_store/features.db
